# add by codebuddy 20260824: PC 前端生产反代配置（替代 Vite dev proxy）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：转发到 backend 容器（与开发时 Vite proxy /api 行为一致）
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 第三方 ERP 接口：转发到公网 ERP（与开发时 Vite proxy /wtoptst 行为一致）
    location /wtoptst/ {
        proxy_pass http://106.14.92.92;
        proxy_set_header Host 106.14.92.92;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
